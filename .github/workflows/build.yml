name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log || {
            # Surface compile errors as annotations so they're readable without the raw log
            grep -E "^e: |error:|What went wrong" -A3 build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CastHub.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CastHub
          path: CastHub.apk

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CastHub.apk \
            --title "Cast Hub — build ${{ github.run_number }}" \
            --notes "Download CastHub.apk on your Android phone and open it to install." \
            --latest
